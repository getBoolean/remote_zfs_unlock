version: 1.1.0+1

environment:
  sdk: ^3.9.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^2.13.0
  file_picker: ^10.3.2
  dart_mappable: ^4.6.1
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^10.0.0
  riverpod_annotation: ^4.0.2
  hive_ce: ^2.19.3
  path_provider: ^2.1.5
  uuid: ^4.5.3
  super_clipboard: ^0.9.1
  google_fonts: 8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  dart_mappable_builder: ^4.7.0
  mockito: ^5.6.3
  riverpod_generator: ^4.0.3
  msix: ^3.16.13

flutter:
  uses-material-design: true

msix_config:
  display_name: Remote ZFS Unlock
  install_certificate: false
